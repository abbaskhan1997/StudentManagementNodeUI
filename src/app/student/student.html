<button (click)="logout()">Logout</button>

<div class="student-form">

  <h2>Student Form</h2>

  <form #studentForm="ngForm">

    <div class="form-group">
      <label>Name</label>
      <input
        name="name"
        [(ngModel)]="formStudent.name"
        required
        placeholder="Enter name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        name="email"
        [(ngModel)]="formStudent.email"
        required
        type="email"
        placeholder="Enter email">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input
        name="phone"
        [(ngModel)]="formStudent.phone"
        required
        placeholder="Enter phone">
    </div>

    <div class="form-group">
      <label>Age</label>
      <input
        name="age"
        [(ngModel)]="formStudent.age"
        required
        type="number"
        placeholder="Enter age">
    </div>

    <div class="form-group">
      <label>Course</label>
      <input
        name="course"
        [(ngModel)]="formStudent.course"
        required
        placeholder="Enter course">
    </div>

    <div class="form-group">
      <label>Gender</label>
      <input
        name="gender"
        [(ngModel)]="formStudent.gender"
        required
        placeholder="Enter gender">
    </div>

    @if (selectedStudent) {

      <button
        type="button"
        [disabled]="studentForm.invalid"
        (click)="updateStudent(selectedStudent._id!, formStudent)">
        Update Student
      </button>

      <button
        type="button"
        (click)="cancelEdit()">
        Cancel
      </button>

    } @else {

      <button
        type="button"
        [disabled]="studentForm.invalid"
        (click)="addStudent(formStudent)">
        Add Student
      </button>

    }

  </form>

</div>

<h2>Students List</h2>

<div class="table-container">

  <table>

    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Age</th>
        <th>Course</th>
        <th>Gender</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>

      @for (student of students; track student._id) {

        <tr>
          <td>{{ student.name }}</td>
          <td>{{ student.email }}</td>
          <td>{{ student.phone }}</td>
          <td>{{ student.age }}</td>
          <td>{{ student.course }}</td>
          <td>{{ student.gender }}</td>

          <td>
            <button (click)="editStudent(student)">
              Edit
            </button>

            <button (click)="deleteStudent(student._id!)">
              Delete
            </button>
          </td>
        </tr>

      }

    </tbody>

  </table>

</div>
